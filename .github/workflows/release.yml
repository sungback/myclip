name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 빌드 잡은 설치파일만 만들고(발행 없음) 아티팩트로 올린다.
# 발행은 단일 release 잡이 한 번만 실행해 electron-builder의 멀티잡 릴리스 경합을 원천 차단한다.
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron 본체와 electron-builder 도구(nsis, 7zip, winCodeSign 등) 캐싱
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci

      # macOS: 서명·공증 시크릿이 등록돼 있을 때만 환경 변수를 내보낸다.
      # (빈 값을 직접 설정하면 electron-builder가 CSC_LINK를 잘못된 경로로 해석해 빌드가 실패함)
      - name: 서명 환경 변수 준비 (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -n "$MAC_CERTS_RAW" ]; then
            printf 'CSC_LINK=%s\n' "$MAC_CERTS_RAW" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$MAC_CERTS_PW_RAW" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_RAW" ]; then
            printf 'APPLE_ID=%s\n' "$APPLE_ID_RAW" >> "$GITHUB_ENV"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$APPLE_APP_SPEC_PW_RAW" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID_RAW" >> "$GITHUB_ENV"
          fi
        env:
          MAC_CERTS_RAW: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PW_RAW: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPEC_PW_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          EXTRA=""
          if [ -n "$APPLE_ID" ]; then EXTRA="--config.mac.notarize=true"; fi
          npm exec electron-builder -- --publish never $EXTRA

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm exec electron-builder -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
