name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 빌드 잡은 설치파일만 만들고(발행 없음) 아티팩트로 올린다.
# 발행은 단일 release 잡이 한 번만 실행해 electron-builder의 멀티잡 릴리스 경합을 원천 차단한다.
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron 본체와 electron-builder 도구(nsis, 7zip, winCodeSign 등) 캐싱
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci

      # macOS: MAC_CERTS/APPLE_* 시크릿이 등록돼 있으면 서명+공증, 없으면 무서명으로 빌드
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          EXTRA=""
          if [ -n "$APPLE_ID" ]; then EXTRA="--config.mac.notarize=true"; fi
          npm exec electron-builder -- --publish never $EXTRA
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm exec electron-builder -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
